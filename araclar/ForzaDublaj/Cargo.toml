[package]
name = "forzadublaj"
version = "0.1.0"
edition = "2024"

# Sürümler Evrenot'unkilerle aynı (Cargo.lock oradan kopyalandı): bilgisayardaki önbellekten derlenir.
[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
fancy-regex = "0.20.0"
hound = "3.5.1"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "cuda", "api-22"] }
rayon = "1.12.0"
realfft = "3.5.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
unicode-normalization = "0.1.26"
ureq = { version = "3", features = ["json"] }
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
